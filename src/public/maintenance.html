<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="15">
<title>Sistem Güncelleniyor — ITManager</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1f2937;
  }
  .card {
    max-width: 420px;
    text-align: center;
    padding: 40px 32px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { font-size: 14px; color: #6b7280; line-height: 1.6; margin: 0 0 20px; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>Sistem Güncelleniyor</h1>
    <div class="spinner"></div>
    <p>ITManager şu anda bir güncelleme nedeniyle kısa süreliğine kullanım dışı. Bu sayfa otomatik olarak yenilenecektir, lütfen birkaç dakika içinde tekrar deneyin.</p>
  </div>
</body>
</html>
